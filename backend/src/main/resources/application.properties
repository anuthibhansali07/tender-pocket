# Server Port (Default 8090; uses SPRING_PORT if explicitly set, avoiding collision with frontend PORT=8085)
server.port=${SPRING_PORT:8090}

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tender_pocket?sslmode=disable}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Spring Framework configuration
spring.main.allow-bean-definition-overriding=true
spring.jpa.open-in-view=false

# Security JWT properties
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:315360000}

# Default Account Passwords
app.auth.admin-password=${ADMIN_DEFAULT_PASSWORD:}
app.auth.misteam-password=${MISTEAM_DEFAULT_PASSWORD:}
app.auth.executive-password=${EXECUTIVE_DEFAULT_PASSWORD:}
app.auth.clearance-password=${CLEARANCE_DEFAULT_PASSWORD:}
app.auth.tpc-password=${TPC_DEFAULT_PASSWORD:}

# AWS S3 Storage configuration
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.enabled=${AWS_S3_ENABLED:false}

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:}

# File upload and attachments directories
file.upload-dir=${FILE_UPLOAD_DIR:public/documents}
file.template-dir=${FILE_TEMPLATE_DIR:public/templates}

# Mail SMTP Sender configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.socketFactory.port=${SPRING_MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# IMAP Email Scraping configurations
imap.host=${IMAP_HOST:imap.gmail.com}
imap.port=${IMAP_PORT:993}
imap.username=${IMAP_USERNAME:}
imap.password=${IMAP_PASSWORD:}
imap.sender-filter=${IMAP_SENDER_FILTER:admin@bidsnrfp.com}

# AI Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:}

# Specification conversion (Azure OpenAI)
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
techspec.pricing.input-usd-per-million=${TECHSPEC_GPT_INPUT_USD_PER_MILLION:0.05}
techspec.pricing.cached-input-usd-per-million=${TECHSPEC_GPT_CACHED_INPUT_USD_PER_MILLION:0.005}
techspec.pricing.output-usd-per-million=${TECHSPEC_GPT_OUTPUT_USD_PER_MILLION:0.40}
techspec.usd-to-inr-rate=${TECHSPEC_USD_TO_INR_RATE:}
techspec.usd-to-inr-rate-date=${TECHSPEC_USD_TO_INR_RATE_DATE:}

# Request & Tomcat Connection Timeout for AI Vision Document Processing (3 minutes)
spring.mvc.async.request-timeout=180000
server.tomcat.connection-timeout=180000
server.tomcat.max-swallow-size=50MB

# Spring Multipart Upload Configuration (Allow up to 50 MB files)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Serialization Naming Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE

# Application Version & Auto-Update Configuration
app.version=1.0.0
app.update.github-repo=cavipulvbhandari/tender-pocket-spring-workflow

# Scheduled jobs. They share this many worker threads, so a long GeM import no longer holds up
# the 8:00 AM digest email, retry checks or the state import start (Spring's default is 1).
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:4}
# GeM + Tender247 email import at fixed IST times (after the 6:00 AM state import).
gem.sync.cron=${GEM_SYNC_CRON:0 30 7,13,19 * * *}
# On startup, import only if GeM was not read within this many hours.
gem.sync.startup-if-older-than-hours=${GEM_SYNC_STARTUP_IF_OLDER_THAN_HOURS:6}

# State & central NIC eProcurement portal sync (portals listed in state-portals.json)
state.sync.enabled=${STATE_SYNC_ENABLED:true}
state.sync.cron=${STATE_SYNC_CRON:0 0 6 * * *}
# At startup, check portals not checked for this many hours (the 6 AM run is missed when the app was off).
state.sync.startup-if-older-than-hours=${STATE_SYNC_STARTUP_IF_OLDER_THAN_HOURS:20}
state.sync.lookback-days=${STATE_SYNC_LOOKBACK_DAYS:2}
state.sync.request-pause-ms=${STATE_SYNC_REQUEST_PAUSE_MS:1500}
state.sync.parallel-portals=${STATE_SYNC_PARALLEL_PORTALS:3}
state.sync.max-details-per-portal=${STATE_SYNC_MAX_DETAILS_PER_PORTAL:400}
state.sync.frequent-portals=${STATE_SYNC_FREQUENT_PORTALS:MN}
state.sync.frequent-cron=${STATE_SYNC_FREQUENT_CRON:0 30 */3 * * *}

# Retry of failed scheduled syncs (GeM keywords and individual state/central portals). A failed
# source is re-run once the delay has passed, at most max-attempts times before it waits for its
# next regular run. Pending retries are kept in memory and lost on restart.
sync.retry.enabled=${SYNC_RETRY_ENABLED:true}
sync.retry.delay-minutes=${SYNC_RETRY_DELAY_MINUTES:120}
sync.retry.max-attempts=${SYNC_RETRY_MAX_ATTEMPTS:3}
sync.retry.check-interval-ms=${SYNC_RETRY_CHECK_INTERVAL_MS:300000}

# Email to the tech team when a scheduled import fails (GeM, any state/UT/central portal,
# Tender247 email import, or any scheduled task that throws). Comma-separated recipients; set
# SYNC_ALERT_EMAILS to override. The same source failing with the same reason is not re-sent
# within repeat-suppress-hours; failed intermediate retries are only emailed when on-each-retry=true.
sync.alert.enabled=${SYNC_ALERT_ENABLED:true}
sync.alert.emails=${SYNC_ALERT_EMAILS:techteam.tenderpocket@gmail.com}
sync.alert.repeat-suppress-hours=${SYNC_ALERT_REPEAT_SUPPRESS_HOURS:6}
sync.alert.on-each-retry=${SYNC_ALERT_ON_EACH_RETRY:false}

# Python 3 command for helper scripts (GeM bid PDF parsing). Empty: detect python3 / python / py -3.
python.command=${PYTHON_COMMAND:}

# Logging: console plus a daily-rolling file. Paths are relative to the directory the backend
# starts in (backend/ for mvn spring-boot:run, /app in Docker). System.out / System.err lines
# are routed here too (see StdoutLogBridge).
logging.file.name=${LOG_FILE:logs/tender-pocket-backend.log}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:20MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY_DAYS:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}
logging.level.root=${LOG_LEVEL:INFO}
