# Server Port (hard-set default 8090 to avoid conflict with Oracle on 8080, Next.js on 8085, and ambient PORT env vars)
server.port=${SPRING_PORT:8090}


# PostgreSQL Datasource Configuration (Primary Database)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tender_pocket?sslmode=disable}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow overriding bean definitions (useful for tests/security configurations)
spring.main.allow-bean-definition-overriding=true
spring.jpa.open-in-view=false

# Security JWT properties (Can be overridden via JWT_SECRET and JWT_EXPIRATION environment variables)
jwt.secret=${JWT_SECRET:9a6156a5c2d3a3f5a2f8c5b8e9b6a1c8d5e6f3b2a5c8d3e4f5a8b9c1d2e3f4a5}
jwt.expiration=${JWT_EXPIRATION:315360000}

# Default Account Initial Passwords (overridable via environment variables)
app.auth.admin-password=${ADMIN_DEFAULT_PASSWORD:Marken@123$}
app.auth.misteam-password=${MISTEAM_DEFAULT_PASSWORD:misteam}
app.auth.executive-password=${EXECUTIVE_DEFAULT_PASSWORD:executive123}
app.auth.clearance-password=${CLEARANCE_DEFAULT_PASSWORD:clearance123}
app.auth.tpc-password=${TPC_DEFAULT_PASSWORD:tpc123}


# File upload and attachments directories
file.upload-dir=public/documents
file.template-dir=public/templates

# Mail SMTP Sender configuration (Nodemailer alerts equivalent)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# IMAP Email Scraping configurations
imap.host=imap.gmail.com
imap.port=993
imap.username=${IMAP_USERNAME:}
imap.password=${IMAP_PASSWORD:}
imap.sender-filter=${IMAP_SENDER_FILTER:}

# AI Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# Specification conversion uses Azure GPT-5 nano; pricing and INR estimates are configurable.
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
techspec.pricing.input-usd-per-million=${TECHSPEC_GPT_INPUT_USD_PER_MILLION:0.05}
techspec.pricing.cached-input-usd-per-million=${TECHSPEC_GPT_CACHED_INPUT_USD_PER_MILLION:0.005}
techspec.pricing.output-usd-per-million=${TECHSPEC_GPT_OUTPUT_USD_PER_MILLION:0.40}
techspec.usd-to-inr-rate=${TECHSPEC_USD_TO_INR_RATE:}
techspec.usd-to-inr-rate-date=${TECHSPEC_USD_TO_INR_RATE_DATE:}

# Request & Tomcat Connection Timeout for AI Vision Document Processing (3 minutes)
spring.mvc.async.request-timeout=180000
server.tomcat.connection-timeout=180000
server.tomcat.max-swallow-size=50MB

# Spring Multipart Upload Configuration (Allow up to 50 MB files)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Serialization Naming Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE

# Application Version & Auto-Update Configuration
app.version=1.0.0
app.update.github-repo=cavipulvbhandari/tender-pocket-spring-workflow
