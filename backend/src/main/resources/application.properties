# Server Port (Default 8090; uses SPRING_PORT if explicitly set, avoiding collision with frontend PORT=8085)
server.port=${SPRING_PORT:8090}

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tender_pocket?sslmode=disable}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Spring Framework configuration
spring.main.allow-bean-definition-overriding=true
spring.jpa.open-in-view=false

# Security JWT properties
jwt.secret=${JWT_SECRET:tender_pocket_production_jwt_signing_secret_key_2026_marken_512bit_secure}
jwt.expiration=${JWT_EXPIRATION:315360000}

# Default Account Passwords
app.auth.admin-password=${ADMIN_DEFAULT_PASSWORD:}
app.auth.misteam-password=${MISTEAM_DEFAULT_PASSWORD:}
app.auth.executive-password=${EXECUTIVE_DEFAULT_PASSWORD:}
app.auth.clearance-password=${CLEARANCE_DEFAULT_PASSWORD:}
app.auth.tpc-password=${TPC_DEFAULT_PASSWORD:}

# AWS S3 Storage configuration
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.enabled=${AWS_S3_ENABLED:true}

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:}

# File upload and attachments directories
file.upload-dir=${FILE_UPLOAD_DIR:public/documents}
file.template-dir=${FILE_TEMPLATE_DIR:public/templates}

# Mail SMTP Sender configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.socketFactory.port=${SPRING_MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# IMAP Email Scraping configurations
imap.host=${IMAP_HOST:imap.gmail.com}
imap.port=${IMAP_PORT:993}
imap.username=${IMAP_USERNAME:}
imap.password=${IMAP_PASSWORD:}
imap.sender-filter=${IMAP_SENDER_FILTER:}

# AI Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:}

# Specification conversion (Azure OpenAI)
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
techspec.pricing.input-usd-per-million=${TECHSPEC_GPT_INPUT_USD_PER_MILLION:0.05}
techspec.pricing.cached-input-usd-per-million=${TECHSPEC_GPT_CACHED_INPUT_USD_PER_MILLION:0.005}
techspec.pricing.output-usd-per-million=${TECHSPEC_GPT_OUTPUT_USD_PER_MILLION:0.40}
techspec.usd-to-inr-rate=${TECHSPEC_USD_TO_INR_RATE:}
techspec.usd-to-inr-rate-date=${TECHSPEC_USD_TO_INR_RATE_DATE:}

# Request & Tomcat Connection Timeout for AI Vision Document Processing (3 minutes)
spring.mvc.async.request-timeout=180000
server.tomcat.connection-timeout=180000
server.tomcat.max-swallow-size=50MB

# Spring Multipart Upload Configuration (Allow up to 50 MB files)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Serialization Naming Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE

# Application Version & Auto-Update Configuration
app.version=1.0.0
app.update.github-repo=cavipulvbhandari/tender-pocket-spring-workflow
