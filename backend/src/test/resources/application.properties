# Server Port
server.port=${PORT:8080}

# PostgreSQL Datasource Configuration (Primary Database)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tender_pocket?sslmode=disable}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow overriding bean definitions (useful for tests/security configurations)
spring.main.allow-bean-definition-overriding=true
spring.jpa.open-in-view=false

# Security JWT properties (Expiration set to 10 years = 315360000 seconds)
jwt.secret=9a6156a5c2d3a3f5a2f8c5b8e9b6a1c8d5e6f3b2a5c8d3e4f5a8b9c1d2e3f4a5
jwt.expiration=315360000

# File upload and attachments directories
file.upload-dir=public/documents
file.template-dir=public/templates

# Mail SMTP Sender configuration (Nodemailer alerts equivalent)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:anuthibhansali@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# IMAP Email Scraping configurations
imap.host=imap.gmail.com
imap.port=993
imap.username=${IMAP_USERNAME:anuthibhansali@gmail.com}
imap.password=${IMAP_PASSWORD:}
imap.sender-filter=${IMAP_SENDER_FILTER:anuthibhansali07@gmail.com}

# AI Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# Request & Tomcat Connection Timeout for AI Vision Document Processing (3 minutes)
spring.mvc.async.request-timeout=180000
server.tomcat.connection-timeout=180000
server.tomcat.max-swallow-size=50MB

# Spring Multipart Upload Configuration (Allow up to 50 MB files)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Serialization Naming Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE

# Application Version & Auto-Update Configuration
app.version=1.0.0
app.update.github-repo=cavipulvbhandari/tender-pocket-spring-workflow
